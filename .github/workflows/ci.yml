name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per branch at a time; a newer push supersedes an older one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks git --config .gitleaks.toml --redact --exit-code 1 .

  update-signature:
    name: Update signature
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the signer's one dependency
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --disable-pip-version-check 'cryptography>=42'
      - name: Check the vector with the reference verifier
        # docs/updates.md: the vector must verify under the test key, and must
        # not with one byte of SHA256SUMS changed or under the production key.
        # "Must not" means BAD SIGNATURE, not any failure: a verifier that
        # crashed would otherwise pass.
        run: |
          set -euo pipefail
          python="$RUNNER_TEMP/venv/bin/python"
          vector=tests/update-vector
          test_key=$(cat "$vector/test-key.pub.b64")

          "$python" scripts/sign-release.py verify "$test_key" "$vector/SHA256SUMS"

          refuses() {
            local output
            if output=$("$python" scripts/sign-release.py verify "$1" "$2" 2>&1); then
              echo "::error::$3 verified, and must not."
              exit 1
            fi
            grep -qx "BAD SIGNATURE" <<< "$output" || { echo "::error::$3 failed for the wrong reason: $output"; exit 1; }
            echo "$3: refused, as it should be"
          }

          tampered="$RUNNER_TEMP/tampered"
          mkdir -p "$tampered"
          { printf '2'; tail -c +2 "$vector/SHA256SUMS"; } > "$tampered/SHA256SUMS"
          cmp -s "$vector/SHA256SUMS" "$tampered/SHA256SUMS" && { echo "::error::the tampered copy is unchanged"; exit 1; }
          cp "$vector/SHA256SUMS.sig" "$tampered/"
          refuses "$test_key" "$tampered/SHA256SUMS" "One byte changed"

          # The same awk the release workflow uses, so a docs/updates.md the
          # release could not read the key from fails here first.
          production_key=$(awk '/compiled into both programs:/ {found = 1; next} found && NF {print $1; exit}' docs/updates.md)
          if ! [[ "$production_key" =~ ^[A-Za-z0-9+/]{87}=$ ]] || [ "$production_key" = "$test_key" ]; then
            echo "::error file=docs/updates.md::Could not read the production public key from docs/updates.md."
            exit 1
          fi
          refuses "$production_key" "$vector/SHA256SUMS" "The test vector under the production key"

          # The key is written three times. A program whose copy differs from
          # the document would refuse every release after the one it came in,
          # and nothing else would notice until then. release.yml checks the
          # same before it signs; this is the same failure a commit earlier.
          for source in macos/SolStreamClient/Sources/SolStreamClient/UpdateFormats.swift windows/SolStreamAgent/updater.h; do
            if ! grep -qF "\"$production_key\"" "$source"; then
              echo "::error file=$source::does not carry the production public key in docs/updates.md."
              exit 1
            fi
          done
      - name: Run the release's signing and checking steps with a throwaway key
        # release.yml writes, signs and checks SHA256SUMS with OpenSSL and
        # Python's standard library only, so that nothing else runs beside the
        # key or the token that publishes, and a release workflow cannot be
        # tried short of releasing. This runs those steps exactly as
        # release.yml writes them, on three stand-in assets. What Sign signs,
        # the reference verifier and Publish's check have to accept. Publish's
        # check has to refuse another key, an asset changed after signing, a
        # swapped asset with a SHA256SUMS to match, and a good signature over
        # somebody else's SHA256SUMS. And
        # a key other than the one installed copies trust, Sign has to refuse
        # before signing anything.
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/release-sign"
          mkdir -p "$work/release"
          # A step's script, by its id; $3 is a line it cannot be without.
          extract() {
            yq ".jobs.$1.steps[] | select(.id == \"$2\") | .run" .github/workflows/release.yml > "$work/$2.sh"
            if ! grep -qF "$3" "$work/$2.sh"; then
              echo "::error file=.github/workflows/release.yml::The $1 job has no step with id: $2."
              exit 1
            fi
          }
          extract sign sums 'sha256sum --'
          extract sign sign 'openssl dgst -sha256 -sign'
          extract publish check-signed 'openssl dgst -sha256 -verify'

          export VERSION=9.9.9
          assets=("SolStream-$VERSION-macOS.zip" "SolStream-$VERSION-macOS.dmg" "SolStreamSetup-$VERSION.exe")
          for asset in "${assets[@]}"; do
            head -c 4096 /dev/urandom > "$work/release/$asset"
          done

          umask 077
          openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256 -out "$work/key.pem"
          openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256 -out "$work/other.pem"
          public=$(openssl pkey -in "$work/key.pem" -pubout -outform DER | tail -c 65 | base64 -w 0)
          other_public=$(openssl pkey -in "$work/other.pem" -pubout -outform DER | tail -c 65 | base64 -w 0)

          (cd "$work/release" && bash "$work/sums.sh")
          (cd "$work" && SIGNING_KEY=$(cat key.pem) TRUSTED_KEY=$public bash sign.sh)
          "$RUNNER_TEMP/venv/bin/python" scripts/sign-release.py verify "$public" "$work/release/SHA256SUMS"
          (cd "$work/release" && TRUSTED_KEY=$public bash "$work/check-signed.sh")

          # Refused, and for the reason given: a check that crashed would
          # otherwise pass. Expected refusals print as plain text rather than
          # as annotations on a passing run.
          check_refuses() {
            local output
            if output=$(cd "$1" && TRUSTED_KEY=$2 bash "$work/check-signed.sh" 2>&1); then
              echo "::error::Publish's check accepted $3."
              exit 1
            fi
            if ! grep -qF "$4" <<< "$output"; then
              echo "::error::Publish's check refused $3 for the wrong reason:"
              printf '%s\n' "${output//::error::/refused: }"
              exit 1
            fi
            echo "$3: refused ($4), as it should be"
          }
          check_refuses "$work/release" "$other_public" "the release under another key" "Verification failure"

          # A build changed after signing, with SHA256SUMS left as signed.
          changed="$work/changed"
          mkdir "$changed"
          cp "${assets[@]/#/$work/release/}" "$work/release/SHA256SUMS" "$work/release/SHA256SUMS.sig" "$changed/"
          printf 'x' >> "$changed/SolStream-$VERSION-macOS.dmg"
          check_refuses "$changed" "$public" "a DMG changed after signing" "FAILED"

          # What a job that can replace artifacts would do: change a build and
          # write SHA256SUMS to match, keeping the signature it cannot remake.
          swapped="$work/swapped"
          mkdir "$swapped"
          cp "${assets[@]/#/$work/release/}" "$swapped/"
          printf 'x' >> "$swapped/SolStreamSetup-$VERSION.exe"
          (cd "$swapped" && bash "$work/sums.sh")
          cp "$work/release/SHA256SUMS.sig" "$swapped/"
          check_refuses "$swapped" "$public" "a swapped setup with SHA256SUMS to match" "Verification failure"

          # A signature that is good, over a SHA256SUMS naming other files.
          replayed="$work/replayed"
          mkdir "$replayed"
          cp "${assets[@]/#/$work/release/}" tests/update-vector/SHA256SUMS tests/update-vector/SHA256SUMS.sig "$replayed/"
          check_refuses "$replayed" "$(cat tests/update-vector/test-key.pub.b64)" "the test vector's signed SHA256SUMS" "does not list exactly the three assets"

          rm "$work/release/SHA256SUMS.sig"
          if (cd "$work" && SIGNING_KEY=$(cat other.pem) TRUSTED_KEY=$public bash sign.sh) 2>&1 | sed 's/^::error::/refused: /'; then
            echo "::error::The signing step signed with a key other than the one installed copies trust."
            exit 1
          fi
          if [ -e "$work/release/SHA256SUMS.sig" ]; then
            echo "::error::The signing step refused the key but wrote a signature anyway."
            exit 1
          fi

  macos:
    name: macOS client
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: swift --version
      - name: Package
        # The release build and the packaging release.yml runs, for this Mac's
        # architecture only (a release adds --universal): the zip and DMG
        # names, the strict signature check and the zip unpacked and checked
        # as the updater will. A break here would otherwise first show on a
        # pushed tag. The tests below make the debug build.
        run: bash scripts/package-macos.sh --dev
      - name: Test
        working-directory: macos/SolStreamClient
        # The UI tests launch the app and need a logged-in session; the unit
        # tests cover the protocol, input, audio and layout logic headlessly.
        run: swift test --skip SolStreamClientUITests

  windows:
    name: Windows host (MSVC)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - name: Package
        # What release.yml runs: the MSVC build, then the setup under its
        # release name, refused if its version block disagrees with VERSION.
        run: ./scripts/package-windows.ps1
      - name: Check update signatures with the built setup
        # The host is its own updater; this is the contract's CLI
        # (docs/updates.md) run against the test vector, on the setup under its
        # release name and from outside an install folder, as release.yml runs
        # it before publishing.
        run: |
          $version = Get-Content VERSION -TotalCount 1
          $exe = (Resolve-Path "dist\SolStreamSetup-$version.exe").Path
          $vector = (Resolve-Path "tests\update-vector").Path
          $testKey = (Get-Content "$vector\test-key.pub.b64" -TotalCount 1).Trim()

          # The same signature over a SHA256SUMS with one byte changed.
          $tampered = (New-Item -ItemType Directory -Force (Join-Path $env:RUNNER_TEMP "tampered-vector")).FullName
          $bytes = [IO.File]::ReadAllBytes("$vector\SHA256SUMS")
          $bytes[0] = $bytes[0] -bxor 1
          [IO.File]::WriteAllBytes("$tampered\SHA256SUMS", $bytes)
          Copy-Item "$vector\SHA256SUMS.sig" $tampered

          function Test-Signature([string[]] $arguments, [int] $expected, [string] $what) {
              $start = [Diagnostics.ProcessStartInfo]::new($exe)
              $start.UseShellExecute = $false
              foreach ($argument in @("--verify-update-signature") + $arguments) { $start.ArgumentList.Add($argument) }
              $process = [Diagnostics.Process]::Start($start)
              # A build that does not know the flag opens its setup window
              # instead, and nobody on a runner is going to close it.
              if (-not $process.WaitForExit(60000)) {
                  $process.Kill($true)
                  throw "${what}: still running after a minute"
              }
              if ($process.ExitCode -ne $expected) {
                  throw "${what}: exit code $($process.ExitCode), expected $expected"
              }
              Write-Host "${what}: $expected, as expected"
          }

          Test-Signature @("$vector\SHA256SUMS", "$vector\SHA256SUMS.sig", $testKey) 0 "test vector, test key"
          Test-Signature @("$tampered\SHA256SUMS", "$tampered\SHA256SUMS.sig", $testKey) 1 "one byte changed"
          Test-Signature @("$vector\SHA256SUMS", "$vector\SHA256SUMS.sig") 1 "test vector, compiled-in key"
      # The updater's unit tests (version order, SHA256SUMS parsing, the
      # redirect allow-list, anti-rollback). package-windows.ps1 configures with
      # BUILD_TESTING off and windows-cross cannot run what it compiles, so this
      # is the only place they run under MSVC. A build dir of their own leaves
      # the packaging build alone, and one command per step because pwsh only
      # looks at $LASTEXITCODE when a step ends.
      - name: Configure updater tests
        run: cmake -S . -B build-tests -DBUILD_TESTING=ON
      - name: Build updater tests
        run: cmake --build build-tests --target SolStreamUpdaterTests --config Release
      - name: Run updater tests
        run: ctest --test-dir build-tests -C Release -R '^updater$' --output-on-failure --no-tests=error

  windows-cross:
    name: Windows host (mingw syntax check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install mingw-w64
        run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-x86-64-posix
      - name: Cross-compile
        env:
          CXX: x86_64-w64-mingw32-g++-posix
        run: sh windows/SolStreamAgent/build-cross.sh
