name: CI macOS

# The Mac client, whenever anything it is built from changes. A pull request
# runs only the tests unless it changes the packaging.
on:
  push:
    branches: [main]
    paths:
      - 'macos/**'
      - 'scripts/package-macos.sh'
      - 'VERSION'
      - '.github/workflows/ci-macos.yml'
  pull_request:
    paths:
      - 'macos/**'
      - 'scripts/package-macos.sh'
      - 'VERSION'
      - '.github/workflows/ci-macos.yml'
  workflow_dispatch:

# One run per branch at a time; a newer push supersedes an older one.
concurrency:
  group: ci-macos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos:
    name: macOS client
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The merge commit and its first parent, the base it merges into,
          # for what a pull request changes.
          fetch-depth: 2
      - name: Toolchain
        run: swift --version
      - name: Does this change the packaging?
        id: packaging
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only HEAD^1 HEAD | grep -Eq '^(scripts/package-macos\.sh|VERSION|macos/SolStreamClient/Package\.swift|macos/SolStreamClient/Resources/.*|\.github/workflows/ci-macos\.yml)$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Package
        # The release build and the packaging release.yml runs, for this Mac's
        # architecture only (a release adds --universal): the zip and DMG
        # names, the strict signature check and the zip unpacked and checked
        # as the updater will. A break here would otherwise first show on a
        # pushed tag. On main, and on a pull request that changes the
        # packaging. The tests below make the debug build.
        if: github.event_name != 'pull_request' || steps.packaging.outputs.changed == 'true'
        run: bash scripts/package-macos.sh --dev
      - name: Test
        working-directory: macos/SolStreamClient
        # The UI tests launch the app and need a logged-in session; the unit
        # tests cover the protocol, input, audio and layout logic headlessly.
        run: swift test --skip SolStreamClientUITests
